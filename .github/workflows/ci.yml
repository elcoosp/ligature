# Ligature CI (§13). Gates: fmt, clippy pedantic (-D warnings), tests,
# bench compilation (benched from day one, §14.2), S4 canonical-IR parity
# (both frontend legs), D-8 reproducibility, the S2 patch-spike budget
# (< 1 s save→frame), the §14.2 budget ledger (M4), and the §10 no_std proof
# (M4). The gates ship in the `lig` CLI itself (M2: the former xtask folded
# into `lig fixtures …` / `lig reproducibility` / `lig patch-spike`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt + clippy pedantic + test + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy pedantic
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: benchmarks compile (criterion, all targets)
        run: cargo bench --workspace --no-run
      - name: S4 canonical-IR parity (both frontend legs)
        run: cargo run -p lig-cli -- fixtures verify
      - name: NFR-5 admission fixtures
        run: cargo run -p lig-cli -- fixtures admission
      - name: V.7 rule table ↔ fixtures sync
        run: cargo run -p lig-cli -- fixtures rules-sync
      - name: D-8 reproducibility (counter codegen byte-diff)
        run: cargo run -p lig-cli -- reproducibility
      - name: D-9 digest-gated re-emit + LIG-E020 cycle recovery (M3)
        run: cargo run -p lig-cli -- incremental

  patch-spike:
    # S2 acceptance, M3 extension: two chained generations with stub thunks,
    # < 1 s per save, on Linux and macOS (§17, ADR-016).
    name: S2/M3 patch-spike (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: save→frame budget gate
        run: cargo run -p lig-cli -- patch-spike

  budgets:
    # §14.2 budget ledger (M4): the bench workloads re-measured in-process
    # against the committed ceilings. Time budgets are release numbers — the
    # enforcement run is `--release` (the dev profile measures only).
    name: §14.2 budget ledger (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: budget ledger gate
        run: cargo run -p lig-cli --release -- budgets

  no-std:
    # §10 no_std proof (M4): the structural contract (zero deps, forbid
    # unsafe, std test-only) plus bare-metal builds of lig-runtime and a
    # generated unit for thumbv7em + aarch64-none.
    name: §10 no_std proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install no_std proof targets
        run: rustup target add thumbv7em-none-eabihf aarch64-unknown-none-softfloat
      - name: no_std proof gate
        run: cargo run -p lig-cli -- no-std

  bench-swc:
    # §2.5 / §14.2: Oxc vs SWC re-benchmark on our own workload. SWC is
    # feature-gated (`bench-swc`) and never linked into compiler crates.
    name: Oxc vs SWC re-benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: swc_compare bench
        run: |
          cargo bench -p lig-parse-solid --features bench-swc \
            --bench swc_compare -- --warm-up-time 1 --measurement-time 3
