# Release flow (§13): tags build a git-cliff changelog and attach it to the
# GitHub release. Conventional commits (enforced in review; parse config in
# cliff.toml) drive the sections.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: changelog + GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Generate full changelog
        run: git-cliff --config cliff.toml --output CHANGELOG.md
      - name: Extract latest release notes
        run: git-cliff --config cliff.toml --latest --strip all > RELEASE_NOTES.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: CHANGELOG.md
