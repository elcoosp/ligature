[[budget]]
name = "codegen_for_event_composed"
metric = "time"
budget = 4500.0
note = "M17 reference median 816 µs (codegen/for-event-composed bench, release, Linux x86_64); ≈5.5× headroom"

# Codegen over the list-component surface (M13): per-item instance identity —
# the `Vec<Option<Child>>` store, the plan-op mirroring in the reconcile, and
