[[budget]]
name = "codegen_list_component"
metric = "time"
budget = 4800.0
note = "M13 reference median 901 µs (codegen/list-component bench, release, Linux x86_64); ≈5.3× headroom"

# One full cold session pass (M16): set_source + compile over the M0
# reference workload — lower, admission, the build-order cycle check, and
# codegen ride the digest-gated pass `lig build` runs per unit.
[[budget]]
name = "session_compile_counter"
metric = "time"
budget = 3500.0
note = "M16 reference median 691 µs (session/compile-counter bench, release, Linux x86_64); ≈5.1× headroom"

# M18: the composed-content module — the fill-carried composed reconcile,
# the per-mount fill assembly in the mounting arm, the receiver-guarded ctx
# unwraps, and the per-item fire fn ride generate_module.
[[budget]]
name = "codegen_for_composed_content"
metric = "time"
budget = 6500.0
note = "M18 reference median 1251 µs (codegen/for-composed-content bench, release, Linux x86_64, re-measured 1152-1251 across three runs); ≈5.2× headroom"

# The emission-target seam (sink seam): one cold session pass plus
# emit_units_to into a fresh in-memory MemSink — sourcemap verify, the IR
# JSON, the merged map, the manifest, and the state file ride the pass, no
# filesystem involved (what an embedded consumer pays per pass).
[[budget]]
name = "session_emit_mem"
metric = "time"
budget = 4700.0
note = "sink-seam reference median 883 µs (session/emit_mem bench, release, Linux x86_64, re-measured 852-1094 across three runs); ≈5.3× headroom"

# The watch-sync seam: one cold 8-source registration pass plus one sync
# diff over a fresh snapshot with one edit — the call the lig watch loop
# runs per tick.
[[budget]]
name = "session_sync"
metric = "time"
budget = 70.0
note = "sync-seam reference median 13.3 µs (session/sync bench, release, Linux x86_64, re-measured 13.2-16.0 across three runs); ≈5.3× headroom"

# The observer seam (M19): one cold session pass with the stage events
# delivered to a counting observer — the programmatic event stream on top
# of the plain pass the session_compile_counter row drives unobserved.
[[budget]]
name = "session_observe"
metric = "time"
budget = 3500.0
note = "observer-seam reference median 679 µs (session/observe bench, release, Linux x86_64; the unobserved pass measured 678 µs — the event stream costs ≈0.2%); ≈5.2× headroom"

# The session emission seam (M19): one cold pass plus the one-call
# `Session::emit_to` into a fresh in-memory MemSink — the BR-1 admission
# gate and the profile ledger name ride the call.
[[budget]]
name = "session_emit_to"
metric = "time"
budget = 4500.0
note = "session-emission-seam reference median 867 µs (session/emit_to bench, release, Linux x86_64; the free-fn emit_mem pass measured 850 µs — the one-call front adds the BR-1 gate ≈2%); ≈5.2× headroom"
