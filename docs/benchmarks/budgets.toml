[[budget]]
name = "codegen_ref"
metric = "time"
budget = 1200.0
note = "M12 reference median 234 µs (codegen/ref bench, release); ≈5.1× headroom"

# Codegen over the else-leg surface (M11): the tracked-leg mounting arms
