[[budget]]
name = "codegen_for_event"
metric = "time"
budget = 3500.0
note = "M15 reference median 680 µs (codegen/for-event bench, release, Linux x86_64); ≈5.1× headroom"

# M17: the composed-event module — the ctx-classified composed reconcile,
